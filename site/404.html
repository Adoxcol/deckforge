<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · DeckForge</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0E0F12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px var(--gutter); }
      .not-found .code { font: 500 13px/1 var(--mono); color: var(--accent-text); margin: 28px 0 14px; }
      .not-found h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.035em; line-height: 1.1; }
      .not-found p { margin-top: 14px; color: var(--text-2); font-size: 17px; }
      .not-found .btn { margin-top: 32px; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <img src="/assets/logo.svg" alt="" width="56" height="56" style="margin-inline: auto" />
        <p class="code">404</p>
        <h1>This key isn’t bound to anything.</h1>
        <p>The page you were looking for doesn’t exist.</p>
        <a class="btn btn-primary btn-lg" href="/">Back to DeckForge</a>
      </div>
    </main>
  </body>
</html>
